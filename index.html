<!doctype html>
<html lang="en" data-lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Huawei: A Journey Through Technology</title>
  <meta name="description" content="An independent, bilingual 3D digital exhibition on Huawei's technological evolution since 1987.">
  <meta name="author" content="Spencer Yu (余俊晟)">
  <meta name="color-scheme" content="light dark">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&family=Noto+Sans+SC:wght@400;500;700&display=swap">
  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/sections.css">
  <link rel="stylesheet" href="css/exhibit.css">
  <link rel="stylesheet" href="css/demos.css">
  <link rel="stylesheet" href="css/intro.css">
  <script>
    // Decide before first paint whether the logo intro plays (once per session; never with reduced motion; ?intro=1 forces it).
    (function () {
      try {
        var force = new URLSearchParams(location.search).get('intro') === '1';
        var seen = sessionStorage.getItem('journey-intro-seen');
        var reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
        if (force || (!seen && !reduced)) {
          document.documentElement.classList.add('intro-on');
          if ('scrollRestoration' in history) history.scrollRestoration = 'manual'; // reveal always lands on the hero
        }
      } catch (e) { /* storage blocked: skip the intro */ }
    })();
  </script>
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>
  <a class="skip-link" href="#main" data-i18n="nav.skip">Skip to content</a>

  <!-- Animated logo reveal (shown once per session) -->

        <path class="intro__petal" style="--i:2;--r:56deg" d="M15.8347 24.5c0.1 -0.1 0 -0.2 0 -0.2c-5.3 -3.6 -15.5 -9 -15.5 -9c-0.9 2.9 0.3 5.2 0.3 5.2c1.3 2.8 3.8 3.6 3.8 3.6c1.1 0.5 2.3 0.5 2.3 0.5h9c0.1 0 0.1 -0.1 0.1 -0.1"/>

        <path class="intro__petal" style="--i:2;--r:-56deg" d="M38.7347 15.2s-10.2 5.5 -15.5 9.1c0 0 -0.1 0.1 -0.1 0.2c0 0 0 0.1 0.1 0.1h9.2s0.9 0 2.1 -0.5c0 0 2.5 -0.8 3.9 -3.7c0 -0.1 1.2 -2.4 0.3 -5.2"/>
        <path class="intro__petal" style="--i:3;--r:-72deg" d="M23.4347 25.5s-0.1 0 -0.1 0.1v0.2c1.2 0.8 4.6 3.3 6.3 3.7c0 0 3.1 1.1 5.8 -3.6z"/>
      </svg>
      <svg class="intro__word" viewBox="45.4 9.3 89 16.1" aria-hidden="true">
        <path d="M49.5347 9.8h-3.1v14.8h3.1v-6h6.8v6h3V9.8h-3v6h-6.8zm23.8 8.5c0 2.4-1.2 3.7-3.4 3.7s-3.4-1.3-3.4-3.8V9.8h-3v8.5c0 4.2 2.3 6.6 6.4 6.6 4.1 0 6.4-2.4 6.4-6.7V9.8h-3zm29-8.5l-3.4 10.2-3.3-10.2h-3.2l5.2 14.8h2.5l3.4-9.7 3.3 9.7h2.6l5.1-14.8h-3.1l-3.3 10.2-3.4-10.2zm23.1 5.7h-5.5v-3h8V9.8h-11v14.8h11.3v-2.7h-8.3v-3.7h5.5zm6.4-5.7h3v14.8h-3zm-42.8 11.7l1.3 3.1h3.2l-6.5-14.8-.1-.1h-2.6l-6.5 14.9h3.1l1.3-2.9.1-.2zm-3.4-8l2.1 5 .1.3h-4.6l.1-.3z"/>

      <p class="intro__tag" data-i18n="intro.tag"></p>
      <p class="intro__note" data-i18n="intro.note"></p>
    </div>
    <button type="button" class="intro__skip" data-i18n="intro.skip"></button>
  </div>

  <header class="site-header" id="site-header">
    <div class="site-header__inner">
      <a class="brand" href="#top" data-i18n-attr="aria-label:nav.home">
        <svg class="brand__mark" viewBox="0 0 32 32" aria-hidden="true"><path d="M6 23a10 10 0 0 1 20 0" fill="none" stroke="currentColor" stroke-width="2.4"/><path d="M11 23a5 5 0 0 1 10 0" fill="none" stroke="var(--red)" stroke-width="2.4"/><circle cx="16" cy="23" r="1.8" fill="currentColor"/></svg>
        <span class="brand__text">
          <span class="brand__name" data-i18n="nav.brand"></span>
          <span class="brand__sub" data-i18n="nav.brandSub"></span>
        </span>
      </a>
      <nav class="primary-nav" id="primary-nav" data-i18n-attr="aria-label:nav.label">
        <ul>
          <li><a href="#timeline" data-i18n="nav.timeline"></a></li>
          <li><a href="#ch1"><span class="nav-num">01</span><span data-i18n="nav.ch1"></span></a></li>
          <li><a href="#ch2"><span class="nav-num">02</span><span data-i18n="nav.ch2"></span></a></li>
          <li><a href="#ch3"><span class="nav-num">03</span><span data-i18n="nav.ch3"></span></a></li>
          <li><a href="#ch4"><span class="nav-num">04</span><span data-i18n="nav.ch4"></span></a></li>
          <li><a href="#ch5"><span class="nav-num">05</span><span data-i18n="nav.ch5"></span></a></li>
          <li><a href="#ch6"><span class="nav-num">06</span><span data-i18n="nav.ch6"></span></a></li>
          <li><a href="#sources" data-i18n="nav.sources"></a></li>
        </ul>
      </nav>
      <div class="lang-switch" role="group" data-i18n-attr="aria-label:nav.language">
        <button type="button" data-lang="en" lang="en">EN</button>
        <button type="button" data-lang="zh" lang="zh-Hans">简体中文</button>
      </div>
      <button type="button" class="menu-toggle" aria-expanded="false" aria-controls="primary-nav" data-i18n-attr="aria-label:nav.menu">
        <span></span><span></span>
      </button>
    </div>
    <div class="read-progress" aria-hidden="true"><span id="read-progress-bar"></span></div>
  </header>

  <main id="main">
    <!-- ============ HERO ============ -->
    <section id="top" class="hero" data-theme="dark" aria-labelledby="hero-title">
      <div class="hero__canvas" id="hero-stage" role="img" data-i18n-attr="aria-label:hero.canvasLabel"></div>
      <div class="hero__veil" aria-hidden="true"></div>
      <div class="hero__content wrap">
        <img class="hero__logo" src="assets/logos/huawei-logo-reverse.svg" width="139" height="32" data-i18n-attr="alt:hero.logoAlt" alt="">
        <p class="eyebrow eyebrow--light" data-i18n="hero.eyebrow"></p>
        <h1 id="hero-title" class="hero__title">
          <span class="hero__title-a" data-i18n="hero.titleA"></span>
          <span class="hero__title-b" data-i18n="hero.titleB"></span>
        </h1>
        <p class="hero__lede" data-i18n="hero.lede"></p>
        <div class="hero__actions">
          <a class="btn btn--primary" href="#ch1" data-i18n="hero.ctaPrimary"></a>
          <a class="btn btn--ghost" href="#timeline" data-i18n="hero.ctaSecondary"></a>
        </div>
        <div class="hero__years">
          <div class="years-meter" aria-hidden="true"><span id="years-meter-fill"></span></div>
          <p><strong id="years-label"></strong> <span id="years-note"></span></p>
        </div>
        <p class="hero__byline">
          <span class="hero__byline-label" data-i18n="hero.creditLabel"></span>
          <span class="hero__byline-name" lang="en">Spencer Yu</span>
          <span class="hero__byline-name hero__byline-name--zh" lang="zh-Hans">余俊晟</span>
        </p>
      </div>
      <p class="hero__hint" data-i18n="hero.hint"></p>
      <nav class="hero-preview wrap" data-i18n-attr="aria-label:hero.previewTitle" id="hero-preview"></nav>
    </section>

    <!-- ============ TIMELINE ============ -->
    <section id="timeline" class="section timeline-section" data-theme="light" aria-labelledby="timeline-title">
      <div class="wrap">
        <header class="section-head">
          <p class="eyebrow" data-i18n="timeline.kicker"></p>
          <h2 id="timeline-title" class="display-2" data-i18n="timeline.title"></h2>
          <p class="lede" data-i18n="timeline.lede"></p>
        </header>
        <div class="timeline" id="timeline-root"></div>
      </div>
    </section>

    <!-- ============ CHAPTER 1 ============ -->
    <section id="ch1" class="chapter chapter--c1" data-theme="paper" aria-labelledby="ch1-title">
      <div class="wrap">
        <header class="chapter-head chapter-head--split">
          <div class="chapter-head__num" aria-hidden="true">01</div>
          <div>
            <p class="eyebrow" data-i18n="ch1.kicker"></p>
            <h2 id="ch1-title" class="display-1" data-i18n="ch1.title"></h2>
          </div>
        </header>
        <div class="c1-intro">
          <p class="lede lede--large" data-i18n="ch1.lede"></p>
          <div class="c1-intro__body">
            <p data-i18n="ch1.p1"></p>
            <p data-i18n="ch1.p2"></p>
          </div>
          <ol class="mini-milestones" data-chapter="ch1"></ol>
        </div>
        <div class="exhibit" data-exhibit="switch"></div>
        <div class="callflow" id="callflow"></div>
      </div>
    </section>

    <!-- ============ CHAPTER 2 ============ -->
    <section id="ch2" class="chapter chapter--c2" data-theme="night" aria-labelledby="ch2-title">
      <div class="c2-grid-bg" aria-hidden="true"></div>
      <div class="wrap">
        <header class="chapter-head">
          <div class="chapter-head__num" aria-hidden="true">02</div>
          <p class="eyebrow eyebrow--light" data-i18n="ch2.kicker"></p>
          <h2 id="ch2-title" class="display-1" data-i18n="ch2.title"></h2>
          <p class="lede" data-i18n="ch2.lede"></p>
        </header>
        <div class="generations" id="generations"></div>
        <div class="exhibit exhibit--dark" data-exhibit="aau"></div>
        <ol class="mini-milestones mini-milestones--row" data-chapter="ch2"></ol>
      </div>
    </section>

    <!-- ============ CHAPTER 3 ============ -->
    <section id="ch3" class="chapter chapter--c3" data-theme="light" aria-labelledby="ch3-title">
      <div class="wrap">
        <header class="chapter-head chapter-head--center">
          <div class="chapter-head__num" aria-hidden="true">03</div>
          <p class="eyebrow" data-i18n="ch3.kicker"></p>
          <h2 id="ch3-title" class="display-1" data-i18n="ch3.title"></h2>
          <p class="lede" data-i18n="ch3.lede"></p>
        </header>
        <div class="gallery" id="phone-gallery">
          <div class="gallery__rail" role="tablist" data-i18n-attr="aria-label:ch3.select" id="phone-rail"></div>
          <div class="gallery__main">
            <div class="exhibit exhibit--gallery" data-exhibit="phone"></div>
            <aside class="spec-sheet" id="phone-specs" aria-live="polite"></aside>
          </div>
        </div>
        <div class="compare">
          <h3 class="display-3" data-i18n="ch3.compareTitle"></h3>
          <p class="muted" data-i18n="ch3.compareLede"></p>
          <div class="compare__scroll" tabindex="0" data-i18n-attr="aria-label:ch3.compareTitle"><table class="compare__table" id="phone-compare"></table></div>
        </div>
        <aside class="aside-note">
          <p class="eyebrow" data-i18n="ch3.softwareKicker"></p>
          <p data-i18n="ch3.software"></p>
        </aside>
      </div>
    </section>

    <!-- ============ CHAPTER 4 ============ -->
    <section id="ch4" class="chapter chapter--c4" data-theme="ember" aria-labelledby="ch4-title">
      <div class="wrap">
        <header class="chapter-head chapter-head--split">
          <div class="chapter-head__num" aria-hidden="true">04</div>
          <div>
            <p class="eyebrow eyebrow--light" data-i18n="ch4.kicker"></p>
            <h2 id="ch4-title" class="display-1" data-i18n="ch4.title"></h2>
          </div>
        </header>
        <div class="two-col">
          <p class="lede" data-i18n="ch4.lede"></p>
          <p data-i18n="ch4.p1"></p>
        </div>
        <div class="exhibit exhibit--dark" data-exhibit="inverter"></div>
        <div class="solar-head">
          <h3 class="display-2" data-i18n="solar.title"></h3>
          <p class="lede" data-i18n="solar.lede"></p>
        </div>
        <div class="exhibit exhibit--dark exhibit--wide" data-exhibit="solar"></div>
        <ol class="mini-milestones mini-milestones--row" data-chapter="ch4"></ol>
      </div>
    </section>

    <!-- ============ CHAPTER 5 ============ -->
    <section id="ch5" class="chapter chapter--c5" data-theme="ice" aria-labelledby="ch5-title">
      <div class="wrap">
        <header class="chapter-head">
          <div class="chapter-head__num" aria-hidden="true">05</div>
          <p class="eyebrow" data-i18n="ch5.kicker"></p>
          <h2 id="ch5-title" class="display-1" data-i18n="ch5.title"></h2>
        </header>
        <div class="two-col">
          <p class="lede" data-i18n="ch5.lede"></p>
          <p data-i18n="ch5.p1"></p>
        </div>
        <div class="exhibit" data-exhibit="rack"></div>
        <div class="dataflow" id="dataflow"></div>
        <ol class="mini-milestones mini-milestones--row" data-chapter="ch5"></ol>
      </div>
    </section>

    <!-- ============ CHAPTER 6 ============ -->
    <section id="ch6" class="chapter chapter--c6" data-theme="void" aria-labelledby="ch6-title">
      <div class="c6-glow" aria-hidden="true"></div>
      <div class="wrap">
        <header class="chapter-head chapter-head--center">
          <div class="chapter-head__num" aria-hidden="true">06</div>
          <p class="eyebrow eyebrow--light" data-i18n="ch6.kicker"></p>
          <h2 id="ch6-title" class="display-1" data-i18n="ch6.title"></h2>
          <p class="lede" data-i18n="ch6.lede"></p>
        </header>
        <div class="two-col">
          <p data-i18n="ch6.p1"></p>
          <p data-i18n="ch6.p2"></p>
        </div>
        <div class="exhibit exhibit--dark" data-exhibit="ai"></div>
        <div class="ai-demo" id="ai-demo"></div>
        <ol class="mini-milestones mini-milestones--row" data-chapter="ch6"></ol>
      </div>
    </section>

    <!-- ============ FINALE ============ -->
    <section id="finale" class="section finale" data-theme="light" aria-labelledby="finale-title">
      <div class="wrap">
        <header class="section-head section-head--center">
          <img class="finale__logo" src="assets/logos/huawei-logo-stacked-mono.svg" width="96" height="58" data-i18n-attr="alt:hero.logoAlt" alt="">
          <p class="eyebrow" data-i18n="finale.kicker"></p>
          <h2 id="finale-title" class="display-1" data-i18n="finale.title"></h2>
          <p class="lede" data-i18n="finale.lede"></p>
        </header>
        <div class="convergence" id="convergence"></div>
        <div class="anniversary">
          <div class="anniversary__year" aria-hidden="true">2037</div>
          <div>
            <h3 class="display-3" data-i18n="finale.annTitle"></h3>
            <p data-i18n="finale.annText"></p>
          </div>
        </div>
      </div>
    </section>

    <!-- ============ SOURCES ============ -->
    <section id="sources" class="section sources" data-theme="light" aria-labelledby="sources-title">
      <div class="wrap">
        <header class="section-head">
          <p class="eyebrow" data-i18n="refs.kicker"></p>
          <h2 id="sources-title" class="display-2" data-i18n="refs.title"></h2>
          <p class="lede" data-i18n="refs.lede"></p>
        </header>
        <ul class="method" id="method-list"></ul>
        <ol class="ref-list" id="ref-list"></ol>
      </div>
    </section>
  </main>

  <footer class="site-footer" data-theme="dark">
    <div class="wrap site-footer__inner">
      <img class="site-footer__logo" src="assets/logos/huawei-logo-stacked-reverse.svg" width="96" height="58" data-i18n-attr="alt:hero.logoAlt" alt="">
      <p class="site-footer__credit" data-i18n="footer.credit"></p>
      <p data-i18n="footer.disclaimer"></p>
      <p class="muted site-footer__tm" data-i18n="footer.trademark"></p>
      <p class="muted" data-i18n="footer.tech"></p>
      <div class="site-footer__links">
        <a href="#top" class="link-arrow" data-i18n="footer.top"></a>
        <a href="?intro=1" class="link-arrow" data-i18n="footer.replayIntro"></a>
      </div>
    </div>
  </footer>

  <noscript><p class="noscript">This exhibition requires JavaScript. 本展览需要启用 JavaScript。</p></noscript>
  <script type="module" src="js/main.js"></script>
</body>
</html>
